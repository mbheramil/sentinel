name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: sentinel_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 sentinel sentinel_secret;
        mc mb --ignore-existing local/sentinel-artifacts;
        mc anonymous set download local/sentinel-artifacts;
        echo 'MinIO bucket ready';
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: sentinel-artifacts
      S3_ACCESS_KEY_ID: sentinel
      S3_SECRET_ACCESS_KEY: sentinel_secret
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: development
      API_PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
    profiles:
      - full

  runner:
    build:
      context: ../..
      dockerfile: infra/docker/runner.Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SANDBOX_STRATEGY: local
      NODE_ENV: development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - full

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ../../.env.local
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
