{{- if not .Values.api.existingSecret }}
# WARNING: This secret is a placeholder for development only.
# In production, use an external secrets manager (e.g. External Secrets Operator,
# Vault Agent, AWS Secrets Manager CSI) and set api.existingSecret to the secret name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  DATABASE_URL: ""
  REDIS_URL: ""
  SENTINEL_ENCRYPTION_KEY: ""
  NEXTAUTH_SECRET: ""
  RUNNER_TOKEN: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
{{- end }}
